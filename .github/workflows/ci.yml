name: HDSFD CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m py_compile backend/app.py app.py
      - name: Run School Connect regression tests
        run: python -m unittest tests.test_school_connect -v
      - name: Run migration mapping tests
        run: python -m unittest tests.test_migration_mapping -v
