name: Monthly PythonAnywhere reload

on:
  schedule:
    # 04:00 UTC on the 1st of each month
    - cron: '0 4 1 * *'
  workflow_dispatch:

jobs:
  reload:
    runs-on: ubuntu-latest
    # Opt-in gate: set repository variable PA_ENABLED=true after wiring
    # PA_API_TOKEN / PA_USERNAME secrets.
    if: ${{ vars.PA_ENABLED == 'true' }}
    steps:
      - name: Reload PythonAnywhere webapp via API
        run: |
          set -euo pipefail
          WEBAPP="${PA_USERNAME}.pythonanywhere.com"

          echo "Reloading $WEBAPP ..."
          HTTP_CODE=$(curl -s -o reload_response.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Token $PA_API_TOKEN" \
            "https://www.pythonanywhere.com/api/v0/user/$PA_USERNAME/webapps/$WEBAPP/reload/")

          echo "HTTP $HTTP_CODE"
          cat reload_response.json; echo

          case "$HTTP_CODE" in
            200) echo "Reload OK" ;;
            *) echo "Reload failed with HTTP $HTTP_CODE"; exit 1 ;;
          esac

      - name: Post-reload health check
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            HTTP_CODE=$(curl -s -o health.json -w '%{http_code}' \
              "https://$PA_USERNAME.pythonanywhere.com/api/health" || true)
            echo "Attempt $i: HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              cat health.json; echo
              echo "PythonAnywhere is healthy"
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Health endpoint not reachable — add /api/health to the PA app or ignore if not deployed yet"
        env:
          PA_USERNAME: ${{ secrets.PA_USERNAME }}
          PA_API_TOKEN: ${{ secrets.PA_API_TOKEN }}

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Monthly PythonAnywhere reload failed. Check PA_API_TOKEN validity (tokens expire) and that the webapp name matches $PA_USERNAME.pythonanywhere.com"
        env:
          PA_USERNAME: ${{ secrets.PA_USERNAME }}
